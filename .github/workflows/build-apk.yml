name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract Android project
        run: unzip -o AI-Center-Android-source.zip
      - name: Build APK
        shell: bash
        run: |
          PROJECT=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Ошибка: Android Gradle проект не найден"
            exit 1
          fi
          cd "$(dirname "$PROJECT")"
          gradle --no-daemon assembleDebug
        run: gradle --no-daemon assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Center-Android-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Center-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
